<style>

:root{--gold:#e4b45e;--gold2:#ffe2a0;--line:rgba(228,180,94,.34);--muted:#bfd0d8;--deep:#071824}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#fff;font-family:"Oswald","Arial Narrow",Arial,sans-serif;background:linear-gradient(rgba(3,14,22,.72),rgba(3,14,22,.93)),url("background.webp") center/cover fixed no-repeat}
a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}
.top{min-height:76px;padding:0 3.5vw;display:flex;align-items:center;gap:18px;background:rgba(3,16,26,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;color:var(--gold2);font-size:18px;font-weight:700}.brand img{width:52px;height:52px;object-fit:contain}
.nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.nav a{font-size:14px;font-weight:750}.nav a:hover{color:var(--gold2)}
.wrap{width:min(1220px,calc(100% - 30px));margin:34px auto 70px}
.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(5,27,40,.93),rgba(3,18,28,.96));box-shadow:0 16px 44px rgba(0,0,0,.27)}
.page-head{padding:22px 24px}h1,h2,h3,h4{color:var(--gold2)}h1{font-size:42px;margin:0}.muted{color:var(--muted)}
.editor{display:none;margin-top:14px;padding:16px;border:1px solid rgba(255,226,160,.2);border-radius:13px;background:rgba(3,21,32,.62)}.editor.show{display:block}
.field{margin-top:10px}label{display:block;margin-bottom:5px;color:#dce7eb;font-weight:700;font-size:13px}
input,textarea,select{width:100%;border:1px solid rgba(228,180,94,.28);border-radius:9px;background:#071824;color:#fff;outline:0;padding:10px 11px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:rgba(255,226,160,.78);box-shadow:0 0 0 3px rgba(228,180,94,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{min-height:40px;margin-top:10px;border:0;border-radius:9px;padding:0 14px;background:linear-gradient(#f3d28f,#cb9643);color:#251707;font-weight:900;cursor:pointer}
.btn.secondary{background:#153247;color:#ffe2a0;border:1px solid rgba(228,180,94,.24)}.btn.danger{background:#50252a;color:#ffd7d7;border:1px solid rgba(255,140,140,.2)}
.role-note{margin-top:10px;padding:9px 11px;border:1px solid rgba(126,204,234,.16);border-radius:9px;color:#bcd9e4;background:rgba(126,204,234,.05);font-size:12px}
.filebox{margin-top:10px;padding:10px;border:1px dashed rgba(228,180,94,.25);border-radius:10px;background:rgba(3,20,31,.46)}
.filebox img.preview{display:none;width:min(100%,340px);max-height:210px;object-fit:cover;margin-top:8px;border-radius:9px}.filebox img.preview.show{display:block}
.tag{display:inline-flex;padding:3px 7px;border-radius:999px;background:rgba(228,180,94,.1);border:1px solid rgba(228,180,94,.18);color:#ffe2a0;font-size:10px;font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 8px}.desc{color:#d6e2e7;line-height:1.55;font-size:14px}
.entry-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.empty{padding:26px;text-align:center;color:#9db0b8;border:1px dashed rgba(255,226,160,.18);border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:rgba(228,180,94,.08);border:1px solid rgba(228,180,94,.18);font-size:11px;color:#ffe2a0}.chip button{width:18px;height:18px;border:0;border-radius:50%;background:#51252a;color:#ffd7d7;cursor:pointer}
.preview-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.75);padding:22px;align-items:center;justify-content:center}.preview-modal.open{display:flex}.preview-box{width:min(900px,96vw);max-height:88vh;overflow:auto;padding:22px;border:1px solid rgba(228,180,94,.42);border-radius:18px;background:linear-gradient(180deg,#0a2636,#061721);box-shadow:0 25px 80px rgba(0,0,0,.55)}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}
@media(max-width:900px){.brand span{display:none}.top{align-items:flex-start;padding-top:10px;padding-bottom:10px}.nav{gap:8px}.nav a{font-size:12px}.grid3{grid-template-columns:1fr}}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}

.two-col{margin-top:16px;display:grid;grid-template-columns:285px 1fr;gap:16px;align-items:start}.toc{position:sticky;top:94px;padding:14px;max-height:calc(100vh - 115px);overflow:auto}.toc-group{margin:12px 0 5px;color:#ffe2a0;font-size:13px;font-weight:900;border-bottom:1px solid rgba(228,180,94,.14);padding-bottom:5px}.toc-item{display:block;padding:9px 10px;border:1px solid rgba(255,255,255,.06);border-radius:9px;background:rgba(255,255,255,.025);cursor:pointer;margin-top:6px}.toc-item.active{background:rgba(228,180,94,.08);color:#ffe2a0}.compact-card{padding:17px}.compact-top{display:flex;gap:16px}.compact-img{width:142px;height:142px;object-fit:cover;border-radius:11px;background:#071824;flex:0 0 142px}.codebox{margin-top:10px;padding:8px 11px;border:1px solid rgba(126,204,234,.18);border-radius:8px;background:rgba(126,204,234,.055);font-size:12px}.extra-code-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:7px}.extra-code-row .btn{margin-top:0}.type-manager{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.type-manager .field{flex:1 1 220px}
@media(max-width:860px){.two-col{grid-template-columns:1fr}.toc{position:relative;top:auto;max-height:none}}@media(max-width:620px){.compact-top{flex-direction:column}.compact-img{width:100%;height:220px}}

.content-area{display:grid;gap:18px;min-width:0}.catalog-type-section{scroll-margin-top:105px}.catalog-type-title{margin:0 0 10px;padding:0 2px 7px;border-bottom:1px solid rgba(228,180,94,.2);font-size:22px}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.catalog-card{padding:12px;min-width:0;display:flex;flex-direction:column}.catalog-card.active{border-color:rgba(255,226,160,.62);box-shadow:0 0 0 1px rgba(255,226,160,.08),0 14px 36px rgba(0,0,0,.28)}.catalog-head{display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;align-items:start}.catalog-img{width:82px;height:82px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,226,160,.14);background:#071824}.catalog-card h2{margin:0 0 5px;font-size:20px;line-height:1.12}.catalog-card .tags{margin:3px 0 5px}.catalog-card .desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:0}.catalog-card .codebox{padding:6px 8px;margin-top:7px}.catalog-card .entry-actions{margin-top:auto;padding-top:8px}.toc-type-button{width:100%;border:0;background:transparent;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.toc-type-button span{color:#9db0b8;font-weight:500}.toc-item{cursor:pointer}.toc-item.active{border-color:rgba(255,226,160,.45)}
@media(max-width:1100px){.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.catalog-grid{grid-template-columns:1fr}.catalog-head{grid-template-columns:92px minmax(0,1fr)}.catalog-img{width:92px;height:92px}}

<main class="wrap"><section class="panel page-head"><h1>Предметы</h1><div class="role-note" id="roleNote"></div><div class="editor" id="editor"><h2 id="editorTitle">Добавить предмет</h2>
<div class="grid2"><div class="field"><label>Название</label><input id="name"></div><div class="field"><label>Тип предмета</label><select id="type"></select></div></div>
<div class="type-manager"><div class="field"><label>Новый тип</label><input id="newType"></div><button class="btn secondary" id="addType" type="button">Добавить тип</button></div><div class="chips" id="typeChips"></div>
<div class="field"><label>Описание</label><textarea id="description"></textarea></div><div class="field"><label>Код</label><input id="code"></div>
<div class="field"><label>Дополнительный Код</label><div id="extraCodes"></div><button class="btn secondary" type="button" id="addExtraCode">Добавить Дополнительный Код</button></div>
<div class="filebox"><label>Изображение</label><input id="imageInput" type="file" accept="image/*"><img class="preview" id="imagePreview"></div>
<button class="btn secondary" type="button" id="previewBtn">Предпросмотр</button><button class="btn" id="saveBtn">Опубликовать</button><button class="btn secondary" type="button" id="cancelBtn" style="display:none">Отменить</button><div id="saveStatus" class="role-note" style="display:none"></div>
</div></section><div class="two-col"><aside class="panel toc"><h3>Оглавление по типам предмета</h3><input id="search" placeholder="Поиск по названию или коду"><div id="tocList"></div></aside><section id="content" class="content-area"></section></div></main>
<div class="preview-modal" id="previewModal"><div class="preview-box"><div class="preview-head"><h2>Предпросмотр</h2><button class="btn danger" style="margin:0" onclick="closePreview()">Закрыть</button></div><div id="previewContent"></div></div></div>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function openPreview(html){previewContent.innerHTML=html;previewModal.classList.add('open')}
function closePreview(){previewModal.classList.remove('open')}

const editor=document.getElementById('editor');
const roleNote=document.getElementById('roleNote');
const nameInput=document.getElementById('name');
const typeSelect=document.getElementById('type');
const newTypeInput=document.getElementById('newType');
const addTypeBtn=document.getElementById('addType');
const typeChips=document.getElementById('typeChips');
const descriptionInput=document.getElementById('description');
const codeInput=document.getElementById('code');
const extraCodesHost=document.getElementById('extraCodes');
const addExtraCodeBtn=document.getElementById('addExtraCode');
const imageInput=document.getElementById('imageInput');
const imagePreview=document.getElementById('imagePreview');
const previewBtn=document.getElementById('previewBtn');
const saveBtn=document.getElementById('saveBtn');
const cancelBtn=document.getElementById('cancelBtn');
const saveStatus=document.getElementById('saveStatus');
const searchInput=document.getElementById('search');
const tocList=document.getElementById('tocList');
const content=document.getElementById('content');
const editorTitle=document.getElementById('editorTitle');
const previewModal=document.getElementById('previewModal');
const previewContent=document.getElementById('previewContent');

let currentUser=null;
let isAdmin=false;
let entries=[];
let types=['Оружие','Броня','Аксессуар','Расходник','Материал','Квестовый предмет','Другое'];
let selectedId=null;
let editingId=null;
let image='';
let draftCodes=[];

async function readStore(key,fallback){
  if(!window.KFSupabase?.configured)throw new Error('Supabase не настроен.');
  await KFSupabase.ready;
  const x=await KFSupabase.getStore(key,null);
  return x===null||x===undefined?fallback:x;
}

async function writeStore(key,value){
  if(!window.KFSupabase?.configured)throw new Error('Supabase не настроен.');
  return await KFSupabase.saveStore(key,value);
}

async function saveEntries(){
  entries=await writeStore('kungfuItems',entries);
  return entries;
}
async function saveTypes(){
  types=await writeStore('kungfuItemTypes',types);
  return types;
}

imageInput.addEventListener('change',async()=>{
  const f=imageInput.files&&imageInput.files[0];
  if(!f)return;
  try{
    image=await imageToData(f,2200);
    imagePreview.src=image;
    imagePreview.classList.add('show');
  }catch(e){
    image='';
    imageInput.value='';
    imagePreview.classList.remove('show');
    alert(e.message||'Не удалось обработать изображение.');
  }
});

function renderTypes(){
  const previous=typeSelect.value;
  typeSelect.innerHTML=types.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  if(types.includes(previous))typeSelect.value=previous;
  typeChips.innerHTML=isAdmin
    ?types.map(x=>`<span class="chip">${esc(x)} <button type="button" onclick="removeType('${encodeURIComponent(x)}')">×</button></span>`).join('')
    :'';
}

addTypeBtn.addEventListener('click',async()=>{
  if(!isAdmin)return;
  const v=newTypeInput.value.trim();
  if(!v)return;
  if(types.some(x=>x.toLowerCase()===v.toLowerCase()))return;

  const before=types.slice();
  types.push(v);
  try{
    await saveTypes();
    newTypeInput.value='';
    renderTypes();
    typeSelect.value=v;
  }catch(e){
    types=before;
    alert(e.message||'Не удалось сохранить тип.');
  }
});

window.removeType=async enc=>{
  if(!isAdmin)return;
  const v=decodeURIComponent(enc);
  if(entries.some(x=>x.type===v)){
    alert('Сначала удалите предметы этого типа.');
    return;
  }
  const before=types.slice();
  types=types.filter(x=>x!==v);
  if(!types.length)types=['Другое'];
  try{
    await saveTypes();
    renderTypes();
  }catch(e){
    types=before;
    alert(e.message||'Не удалось удалить тип.');
  }
};

function renderCodes(){
  extraCodesHost.innerHTML=draftCodes.map((v,i)=>`
    <div class="extra-code-row">
      <input value="${esc(v)}" data-code-index="${i}">
      <button class="btn danger" type="button" onclick="removeCode(${i})">×</button>
    </div>`).join('');

  extraCodesHost.querySelectorAll('[data-code-index]').forEach(input=>{
    input.addEventListener('input',()=>{draftCodes[Number(input.dataset.codeIndex)]=input.value});
  });
}
addExtraCodeBtn.addEventListener('click',()=>{
  draftCodes.push('');
  renderCodes();
});
window.removeCode=i=>{
  draftCodes.splice(i,1);
  renderCodes();
};

function codeHtml(item){
  const arr=Array.isArray(item.extraCodes)?item.extraCodes.filter(Boolean):[];
  return `${item.code?`<div class="codebox"><b>Код:</b> ${esc(item.code)}</div>`:''}${arr.map((x,i)=>`<div class="codebox"><b>Дополнительный Код ${i+1}:</b> ${esc(x)}</div>`).join('')}`;
}

function card(item,preview=false){
  return `<article id="item-card-${item.id}" class="panel catalog-card ${item.id===selectedId&&!preview?'active':''}">
    <div class="catalog-head">
      ${item.image?`<img class="catalog-img" src="${item.image}" loading="lazy" alt="${esc(item.name||'Предмет')}">`:'<div class="catalog-img"></div>'}
      <div><h2>${esc(item.name||'Без названия')}</h2><div class="tags"><span class="tag">${esc(item.type||'Без типа')}</span></div></div>
    </div>
    ${item.description?`<div class="desc" style="margin-top:8px">${esc(item.description).replace(/\n/g,'<br>')}</div>`:''}
    ${codeHtml(item)}
    ${isAdmin&&!preview?`<div class="entry-actions"><button class="btn secondary" onclick="editEntry(${item.id})">Редактировать</button><button class="btn danger" onclick="delEntry(${item.id})">Удалить</button></div>`:''}
  </article>`;
}

function render(){
  const q=searchInput.value.trim().toLowerCase();
  const list=entries.filter(x=>
    (x.name||'').toLowerCase().includes(q) ||
    (x.type||'').toLowerCase().includes(q) ||
    (x.description||'').toLowerCase().includes(q) ||
    (x.code||'').toLowerCase().includes(q) ||
    (Array.isArray(x.extraCodes)&&x.extraCodes.some(c=>(c||'').toLowerCase().includes(q)))
  );

  tocList.innerHTML=types.map(type=>{
    const rows=list.filter(x=>(x.type||types[0])===type);
    if(!rows.length)return '';
    return `<button class="toc-group toc-type-button" type="button" onclick="jumpType('${encodeURIComponent(type)}')"><b>${esc(type)}</b><span>${rows.length}</span></button>`+
      rows.map(x=>`<a class="toc-item ${x.id===selectedId?'active':''}" onclick="selectEntry(${x.id})">${esc(x.name||'Без названия')}</a>`).join('');
  }).join('')||'<div class="muted">Пусто</div>';

  content.innerHTML=types.map(type=>{
    const rows=list.filter(x=>(x.type||types[0])===type);
    if(!rows.length)return '';
    return `<section class="catalog-type-section" id="item-type-${encodeURIComponent(type)}"><h2 class="catalog-type-title">${esc(type)} <span class="muted">(${rows.length})</span></h2><div class="catalog-grid">${rows.map(x=>card(x)).join('')}</div></section>`;
  }).join('')||'<div class="panel empty">Предметы пока не добавлены.</div>';
}
window.selectEntry=id=>{
  selectedId=id;render();
  requestAnimationFrame(()=>document.getElementById('item-card-'+id)?.scrollIntoView({behavior:'smooth',block:'center'}));
};
window.jumpType=enc=>{
  const type=decodeURIComponent(enc);
  requestAnimationFrame(()=>document.getElementById('item-type-'+encodeURIComponent(type))?.scrollIntoView({behavior:'smooth',block:'start'}));
};
searchInput.addEventListener('input',()=>{selectedId=null;render()});

function reset(){
  editingId=null;
  image='';
  imageInput.value='';
  imagePreview.removeAttribute('src');
  imagePreview.classList.remove('show');
  nameInput.value='';
  descriptionInput.value='';
  codeInput.value='';
  draftCodes=[];
  renderCodes();
  editorTitle.textContent='Добавить предмет';
  saveBtn.textContent='Опубликовать';
  cancelBtn.style.display='none';
}
cancelBtn.addEventListener('click',reset);

window.editEntry=id=>{
  if(!isAdmin)return;
  const x=entries.find(a=>a.id===id);
  if(!x)return;

  editingId=id;
  nameInput.value=x.name||'';
  typeSelect.value=x.type||types[0];
  descriptionInput.value=x.description||'';
  codeInput.value=x.code||'';
  draftCodes=Array.isArray(x.extraCodes)?[...x.extraCodes]:[];
  image=x.image||'';

  if(image){
    imagePreview.src=image;
    imagePreview.classList.add('show');
  }else{
    imagePreview.removeAttribute('src');
    imagePreview.classList.remove('show');
  }

  renderCodes();
  editorTitle.textContent='Редактировать предмет';
  saveBtn.textContent='Сохранить изменения';
  cancelBtn.style.display='inline-flex';
  window.scrollTo({top:0,behavior:'smooth'});
};

previewBtn.addEventListener('click',()=>{
  openPreview(card({
    id:'preview',
    name:nameInput.value.trim()||'Без названия',
    type:typeSelect.value,
    description:descriptionInput.value,
    code:codeInput.value,
    extraCodes:draftCodes,
    image
  }));
});

saveBtn.addEventListener('click',async()=>{
  if(!isAdmin){
    saveStatus.style.display='block';
    saveStatus.style.color='#ffd0d0';
    saveStatus.textContent='Публикация доступна только администратору.';
    return;
  }

  const n=nameInput.value.trim();
  if(!n){
    alert('Укажите название');
    return;
  }

  const btn=saveBtn;
  const oldText=btn.textContent;
  const before=entries.map(x=>({...x,extraCodes:Array.isArray(x.extraCodes)?[...x.extraCodes]:[]}));
  const wasEdit=!!editingId;

  btn.disabled=true;
  btn.textContent='Публикация...';
  saveStatus.style.display='block';
  saveStatus.style.color='#c8f4d8';
  saveStatus.textContent='Сохранение предмета...';

  try{
    const old=editingId?entries.find(x=>x.id===editingId):null;
    let finalImage=image||(old&&old.image)||'';

    if(finalImage&&/^data:image\//i.test(finalImage)&&window.KFSupabase?.configured){
      try{finalImage=await KFSupabase.uploadImageDataUrlStrict(finalImage)}
      catch(e){console.warn('Items Storage fallback:',e?.message||e)}
    }

    const item={
      id:editingId||Date.now(),
      name:n,
      type:typeSelect.value,
      description:descriptionInput.value.trim(),
      code:codeInput.value.trim(),
      extraCodes:draftCodes.map(x=>x.trim()).filter(Boolean),
      image:finalImage
    };

    if(editingId){
      const i=entries.findIndex(x=>x.id===editingId);
      if(i<0)throw new Error('Редактируемый предмет не найден.');
      entries[i]={...entries[i],...item};
    }else{
      entries.push(item);
    }

    selectedId=item.id;
    await saveEntries();

    reset();
    render();
    saveStatus.style.display='block';
    saveStatus.style.color='#c8f4d8';
    saveStatus.textContent=wasEdit?'Изменения сохранены.':'Предмет опубликован.';
  }catch(e){
    entries=before;
    render();
    saveStatus.style.display='block';
    saveStatus.style.color='#ffd0d0';
    saveStatus.textContent=e.message||'Не удалось опубликовать предмет.';
  }finally{
    btn.disabled=false;
    if(editingId)btn.textContent='Сохранить изменения';
    else if(btn.textContent==='Публикация...')btn.textContent=oldText;
  }
});

window.delEntry=async id=>{
  if(!isAdmin||!confirm('Удалить предмет?'))return;
  const before=entries.slice();
  entries=entries.filter(x=>x.id!==id);
  selectedId=entries.length?entries[0].id:null;
  try{
    await saveEntries();
    render();
  }catch(e){
    entries=before;
    alert(e.message||'Не удалось удалить предмет.');
  }
};

async function initItems(){
  try{
    if(window.KFSupabase?.configured){
      await KFSupabase.ready;
      currentUser=await KFSupabase.getCurrentProfile();
    }
  }catch(e){console.warn('Items auth:',e)}
  if(!currentUser){
    try{currentUser=JSON.parse(localStorage.getItem('kungfuCurrentUser')||'null')}catch{}
  }

  isAdmin=!!currentUser&&(currentUser.role||'user')==='admin';
  if(isAdmin){
    editor.classList.add('show');
    roleNote.textContent='Можно добавлять и редактировать предметы.';
  }else{
    editor.classList.remove('show');
    roleNote.textContent='Редактирование доступно только администратору.';
  }

  const loadedEntries=await readStore('kungfuItems',[]);
  const loadedTypes=await readStore('kungfuItemTypes',types);
  entries=Array.isArray(loadedEntries)?loadedEntries:[];
  if(Array.isArray(loadedTypes)&&loadedTypes.length)types=loadedTypes;
  selectedId=entries.length?entries[0].id:null;

  renderTypes();
  renderCodes();
  render();
}
initItems();
