<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сборник Квестов — Легенды Кунг-Фу</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">

<style>
:root{--gold:#e4b45e;--gold2:#ffe2a0;--line:rgba(228,180,94,.34);--muted:#bfd0d8;--deep:#071824;--danger:#ffb5b5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#fff;font-family:"Oswald","Arial Narrow",Arial,sans-serif;background:linear-gradient(rgba(3,14,22,.72),rgba(3,14,22,.94)),url("background.webp") center/cover fixed no-repeat}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}
.top{min-height:76px;padding:0 3.5vw;display:flex;align-items:center;gap:18px;background:rgba(3,16,26,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}.brand{display:flex;align-items:center;gap:11px;margin-right:auto;color:var(--gold2);font-size:18px;font-weight:700}.brand img{width:52px;height:52px;object-fit:contain}.nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.nav a{font-size:14px;font-weight:750}.nav a:hover,.nav a.active{color:var(--gold2)}
.wrap{width:min(1280px,calc(100% - 30px));margin:34px auto 70px}.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(5,27,40,.94),rgba(3,18,28,.97));box-shadow:0 16px 44px rgba(0,0,0,.28)}.page-head{padding:22px 24px}.page-head h1{font-size:42px;margin:0;color:var(--gold2)}.muted{color:var(--muted);line-height:1.55}.role-note,.save-status{margin-top:10px;padding:9px 11px;border:1px solid rgba(126,204,234,.16);border-radius:9px;color:#bcd9e4;background:rgba(126,204,234,.05);font-size:13px}.save-status:empty{display:none}.admin-badge{display:inline-flex;align-items:center;padding:4px 9px;border:1px solid rgba(255,226,160,.34);border-radius:999px;background:rgba(228,180,94,.08);color:var(--gold2);font-size:11px;font-weight:900;letter-spacing:.05em}
.toolbar{margin-top:16px;display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:10px}.search{width:100%;min-height:42px;border:1px solid rgba(228,180,94,.28);border-radius:10px;background:#071824;color:#fff;outline:0;padding:10px 12px}.search:focus,input:focus,textarea:focus{border-color:rgba(255,226,160,.78);box-shadow:0 0 0 3px rgba(228,180,94,.06)}.btn{min-height:40px;border:0;border-radius:9px;padding:0 14px;background:linear-gradient(#f3d28f,#cb9643);color:#251707;font-weight:800;cursor:pointer}.btn.secondary{background:#153247;color:#ffe2a0;border:1px solid rgba(228,180,94,.24)}.btn.danger{background:#50252a;color:#ffd7d7;border:1px solid rgba(255,140,140,.2)}.btn:disabled{opacity:.55;cursor:not-allowed}
.editor{display:none;margin-top:14px;padding:16px;border:1px solid rgba(255,226,160,.18);border-radius:12px;background:rgba(3,21,32,.58)}.editor.show{display:block}.editor h2{margin:0 0 10px;color:var(--gold2)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field-wide{grid-column:1/-1}.field label{font-weight:750;font-size:13px;color:#dce7eb}.field input,.field textarea{width:100%;border:1px solid rgba(228,180,94,.28);border-radius:9px;background:#071824;color:#fff;outline:0;padding:10px 11px}.field textarea{min-height:115px;resize:vertical}.editor-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px}
.quest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.quest-card{padding:18px;position:relative}.quest-card h2{margin:0;color:#ffe2a0;font-size:24px;line-height:1.15}.quest-title-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.reward{margin-top:12px;padding:10px 12px;border:1px solid rgba(228,180,94,.20);border-radius:10px;background:rgba(228,180,94,.06);color:#f8e6bd}.reward b{color:#ffe2a0}.desc{margin-top:12px;color:#d9e5e9;line-height:1.6;white-space:pre-wrap}.quest-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.empty{grid-column:1/-1;padding:34px;text-align:center;color:#9db0b8}.count-line{margin-top:14px;color:#a9c0cb;font-size:13px}
@media(max-width:900px){.brand span{display:none}.top{align-items:flex-start;padding-top:10px;padding-bottom:10px}.nav{gap:8px}.nav a{font-size:12px}.quest-grid{grid-template-columns:1fr}}
@media(max-width:620px){.wrap{width:calc(100% - 18px);margin-top:18px}.page-head{padding:17px}.page-head h1{font-size:32px}.toolbar,.form-grid{grid-template-columns:1fr}.field-wide{grid-column:auto}.toolbar .btn{width:100%}}
</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=0.0.48"></script>
<script src="storage-config.js?v=0.0.76"></script>
<script src="supabase-sync.js?v=0.0.84"></script>
<link rel="stylesheet" href="site-core-0.0.66.css?v=0.0.84">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><img src="logo.png" alt="Логотип"><span>Руководство Легенд Кунг-Фу</span></a>
  <nav class="nav">
    <a href="index.html">Главная</a><a href="taiwan.html">О Тайвани</a><a href="pirate.html">О Пиратке</a><a href="updates.html">Обновления</a><a href="game-stats.html">Характеристики</a><a class="active" href="quests.html">Квесты</a><a href="accounts-sale.html">Продажа Аккаунтов</a><a href="forum.html">Форум</a><a href="partners.html">Партнеры</a><a href="register.html">Регистрация</a><a href="login.html">Вход</a>
  </nav>
</header>
<main class="wrap">
  <section class="panel page-head">
    <h1>Сборник Квестов</h1>
    <p class="muted">Справочник квестов: название, награда и описание. Добавлять, редактировать и удалять записи могут администратор и модератор.</p>
    <div class="role-note" id="roleNote">Загрузка...</div>
    <div class="toolbar"><input class="search" id="search" type="search" placeholder="Поиск по названию, награде или описанию..."><button class="btn" id="newQuestBtn" type="button" style="display:none">+ Добавить квест</button></div>
    <div class="editor" id="editor">
      <h2 id="editorTitle">Добавить квест</h2>
      <div class="form-grid">
        <div class="field"><label>Название квеста *</label><input id="questName" maxlength="250" placeholder="Название"></div>
        <div class="field"><label>Награда *</label><input id="questReward" maxlength="500" placeholder="Например: 100 лян, предмет, опыт..."></div>
        <div class="field field-wide"><label>Описание</label><textarea id="questDescription" maxlength="10000" placeholder="Описание квеста, условия прохождения, примечания..."></textarea></div>
      </div>
      <div class="editor-actions"><button class="btn danger" id="deleteQuestBtn" type="button" style="display:none;margin-right:auto">Удалить квест</button><button class="btn secondary" id="cancelQuestBtn" type="button">Отмена</button><button class="btn" id="saveQuestBtn" type="button">Сохранить</button></div>
    </div>
    <div class="save-status" id="saveStatus"></div>
    <div class="count-line" id="countLine"></div>
  </section>
  <section class="quest-grid" id="questGrid"></section>
</main>
<script>
(()=>{
'use strict';
const KEY='kungfuQuests',$=id=>document.getElementById(id);
let currentUser=null,isStaff=false,quests=[],editingId=null,saving=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return 'quest_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function normalize(raw){return (Array.isArray(raw)?raw:[]).filter(x=>x&&typeof x==='object').map(x=>({id:String(x.id||uid()),name:String(x.name||x.title||''),reward:String(x.reward||''),description:String(x.description||''),author:String(x.author||''),authorRole:String(x.authorRole||''),createdAt:x.createdAt||null,updatedAt:x.updatedAt||null}))}
function setStatus(t,err=false){$('saveStatus').textContent=t||'';$('saveStatus').style.color=err?'#ffb5b5':'#bcd9e4'}
function roleText(){if(!currentUser)return 'Просмотр доступен всем. Для добавления и редактирования войдите как администратор или модератор.';if(isStaff)return '<span class="admin-badge">'+(currentUser.role==='moderator'?'МОДЕРАТОР':'АДМИН')+'</span> Можно добавлять, редактировать и удалять квесты.';return 'Квесты доступны для просмотра. Редактирование — только администратору или модератору.'}
function badge(x){return window.KFStaffBadge?.(x.authorRole||'admin')||''}
function render(){const q=$('search').value.trim().toLocaleLowerCase();const rows=quests.filter(x=>!q||[x.name,x.reward,x.description].join(' ').toLocaleLowerCase().includes(q));$('countLine').textContent='Найдено: '+rows.length+(q?' из '+quests.length:'');$('questGrid').innerHTML=rows.length?rows.slice().reverse().map(x=>`<article class="panel quest-card"><div class="quest-title-row"><h2>${esc(x.name||'Без названия')}</h2>${badge(x)}</div><div class="reward"><b>Награда:</b> ${esc(x.reward||'—')}</div>${x.description?`<div class="desc">${esc(x.description)}</div>`:'<div class="desc muted">Описание не добавлено.</div>'}${isStaff?`<div class="quest-actions"><button class="btn secondary" type="button" data-edit="${esc(x.id)}">Редактировать</button><button class="btn danger" type="button" data-delete="${esc(x.id)}">Удалить</button></div>`:''}</article>`).join(''):'<div class="panel empty">Квесты пока не добавлены.</div>'}
function reset(){editingId=null;$('questName').value='';$('questReward').value='';$('questDescription').value='';$('editorTitle').textContent='Добавить квест';$('deleteQuestBtn').style.display='none';$('editor').classList.remove('show')}
function openEditor(id=null){if(!isStaff)return;editingId=id;const x=id?quests.find(q=>q.id===id):null;$('questName').value=x?.name||'';$('questReward').value=x?.reward||'';$('questDescription').value=x?.description||'';$('editorTitle').textContent=x?'Редактировать квест':'Добавить квест';$('deleteQuestBtn').style.display=x?'inline-flex':'none';$('editor').classList.add('show');setTimeout(()=>$('questName').focus(),20)}
async function persist(msg){saving=true;setStatus('Сохранение...');try{quests=normalize(await KFSupabase.saveStore(KEY,quests));render();setStatus(msg)}catch(e){setStatus(e?.message||String(e),true);throw e}finally{saving=false}}
async function saveQuest(){if(!isStaff)return;const name=$('questName').value.trim(),reward=$('questReward').value.trim(),description=$('questDescription').value.trim();if(!name||!reward){setStatus('Заполните название квеста и награду.',true);return}const old=editingId?quests.find(x=>x.id===editingId):null;const row={id:old?.id||uid(),name,reward,description,author:old?.author||currentUser?.nickname||currentUser?.email||'',authorRole:old?.authorRole||(old?'admin':currentUser?.role)||'admin',createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(old)quests=quests.map(x=>x.id===old.id?row:x);else quests=[...quests,row];try{await persist(old?'Квест обновлён.':'Квест добавлен.');reset()}catch{}}
async function deleteQuest(id){if(!isStaff)return;const x=quests.find(q=>q.id===id);if(!x||!confirm('Удалить квест «'+(x.name||'Без названия')+'»?'))return;const before=quests;quests=quests.filter(q=>q.id!==id);try{await persist('Квест удалён.');if(editingId===id)reset()}catch{quests=before;render()}}
async function load(remoteOnly=false){try{await KFSupabase.ready;if(!remoteOnly){currentUser=await KFSupabase.getCurrentProfile();isStaff=!!currentUser&&['admin','moderator'].includes(currentUser.role);$('roleNote').innerHTML=roleText();$('newQuestBtn').style.display=isStaff?'inline-flex':'none'}quests=normalize(await KFSupabase.getStore(KEY,[]));render()}catch(e){$('roleNote').textContent='Ошибка загрузки: '+(e?.message||String(e));setStatus(e?.message||String(e),true)}}
$('search').addEventListener('input',render);$('newQuestBtn').addEventListener('click',()=>openEditor());$('cancelQuestBtn').addEventListener('click',reset);$('saveQuestBtn').addEventListener('click',saveQuest);$('deleteQuestBtn').addEventListener('click',()=>editingId&&deleteQuest(editingId));$('questGrid').addEventListener('click',e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(ed)openEditor(ed.dataset.edit);if(del)deleteQuest(del.dataset.delete)});window.addEventListener('kf-supabase-synced',e=>{if(e.detail?.key===KEY&&!saving)setTimeout(()=>load(true),100)});load();
})();
</script>
</body>
</html>
