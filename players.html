<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игроки — Легенды Кунг-Фу</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>

:root{--gold:#e4b45e;--gold2:#ffe2a0;--line:rgba(228,180,94,.34);--muted:#bfd0d8;--deep:#071824}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#fff;font-family:"Oswald","Arial Narrow",Arial,sans-serif;background:linear-gradient(rgba(3,14,22,.72),rgba(3,14,22,.93)),url("background.webp") center/cover fixed no-repeat}
a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}
.top{min-height:76px;padding:0 3.5vw;display:flex;align-items:center;gap:18px;background:rgba(3,16,26,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;color:var(--gold2);font-size:18px;font-weight:700}.brand img{width:52px;height:52px;object-fit:contain}
.nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.nav a{font-size:14px;font-weight:750}.nav a:hover{color:var(--gold2)}
.wrap{width:min(1220px,calc(100% - 30px));margin:34px auto 70px}
.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(5,27,40,.93),rgba(3,18,28,.96));box-shadow:0 16px 44px rgba(0,0,0,.27)}
.page-head{padding:22px 24px}h1,h2,h3,h4{color:var(--gold2)}h1{font-size:42px;margin:0}.muted{color:var(--muted)}
.editor{display:none;margin-top:14px;padding:16px;border:1px solid rgba(255,226,160,.2);border-radius:13px;background:rgba(3,21,32,.62)}.editor.show{display:block}
.field{margin-top:10px}label{display:block;margin-bottom:5px;color:#dce7eb;font-weight:700;font-size:13px}
input,textarea,select{width:100%;border:1px solid rgba(228,180,94,.28);border-radius:9px;background:#071824;color:#fff;outline:0;padding:10px 11px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:rgba(255,226,160,.78);box-shadow:0 0 0 3px rgba(228,180,94,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{min-height:40px;margin-top:10px;border:0;border-radius:9px;padding:0 14px;background:linear-gradient(#f3d28f,#cb9643);color:#251707;font-weight:900;cursor:pointer}
.btn.secondary{background:#153247;color:#ffe2a0;border:1px solid rgba(228,180,94,.24)}.btn.danger{background:#50252a;color:#ffd7d7;border:1px solid rgba(255,140,140,.2)}
.role-note{margin-top:10px;padding:9px 11px;border:1px solid rgba(126,204,234,.16);border-radius:9px;color:#bcd9e4;background:rgba(126,204,234,.05);font-size:12px}
.filebox{margin-top:10px;padding:10px;border:1px dashed rgba(228,180,94,.25);border-radius:10px;background:rgba(3,20,31,.46)}
.filebox img.preview{display:none;width:min(100%,340px);max-height:210px;object-fit:cover;margin-top:8px;border-radius:9px}.filebox img.preview.show{display:block}
.tag{display:inline-flex;padding:3px 7px;border-radius:999px;background:rgba(228,180,94,.1);border:1px solid rgba(228,180,94,.18);color:#ffe2a0;font-size:10px;font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 8px}.desc{color:#d6e2e7;line-height:1.55;font-size:14px}
.entry-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.empty{padding:26px;text-align:center;color:#9db0b8;border:1px dashed rgba(255,226,160,.18);border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:rgba(228,180,94,.08);border:1px solid rgba(228,180,94,.18);font-size:11px;color:#ffe2a0}.chip button{width:18px;height:18px;border:0;border-radius:50%;background:#51252a;color:#ffd7d7;cursor:pointer}
.preview-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.75);padding:22px;align-items:center;justify-content:center}.preview-modal.open{display:flex}.preview-box{width:min(900px,96vw);max-height:88vh;overflow:auto;padding:22px;border:1px solid rgba(228,180,94,.42);border-radius:18px;background:linear-gradient(180deg,#0a2636,#061721);box-shadow:0 25px 80px rgba(0,0,0,.55)}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}
@media(max-width:900px){.brand span{display:none}.top{align-items:flex-start;padding-top:10px;padding-bottom:10px}.nav{gap:8px}.nav a{font-size:12px}.grid3{grid-template-columns:1fr}}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}

.composer{display:none}.composer.show{display:block}.server-columns{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px;align-items:start}.server-column{padding:16px}.server-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(228,180,94,.18)}.player-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.player{display:flex;flex-direction:column;min-width:0;padding:10px;border:1px solid rgba(228,180,94,.16);border-radius:12px;background:rgba(255,255,255,.025)}.avatar{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#071824;border:1px solid rgba(228,180,94,.16)}.player h3{font-size:18px;line-height:1.15;overflow-wrap:anywhere}.player .muted{font-size:12px;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-height:50px}.date{font-size:10px;color:#91a8b2;margin-top:4px}.contact{margin-top:7px;padding:6px 7px;border-radius:7px;background:rgba(126,204,234,.06);border:1px solid rgba(126,204,234,.16);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.contact a{color:#9fdfff;text-decoration:underline}.heart{display:inline-flex;align-items:center;gap:5px;margin-top:8px;min-height:31px;padding:0 9px;border:1px solid rgba(255,120,140,.25);border-radius:999px;background:rgba(110,30,45,.18);color:#ffd8df;cursor:pointer;font-weight:800}.heart.liked{background:rgba(170,40,65,.33);border-color:rgba(255,130,150,.48)}.heart:disabled{opacity:.55;cursor:not-allowed}.player .btn{width:100%;min-height:34px;margin-top:7px;font-size:12px}
@media(max-width:1120px){.player-list{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:850px){.player-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.player-list{grid-template-columns:1fr}.player{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}.avatar{width:96px;height:96px;aspect-ratio:auto}.player>div{min-width:0}}
</style><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head><body><header class="top"><a class="brand" href="index.html"><img src="logo.png"><span>Руководство Легенд Кунг-Фу</span></a><nav class="nav">

<main class="wrap"><section class="panel page-head"><h1>Игроки</h1><p class="muted">Поставить ❤️ может только зарегистрированный пользователь.</p><div class="editor composer" id="composer"><h2>Добавить себя</h2><div class="grid2"><input id="nick" placeholder="Никнейм"><select id="server"><option>Тайвань</option><option>Пиратка</option></select></div><input id="image" type="file" accept="image/*"><input id="contact" placeholder="Связаться"><textarea id="description" placeholder="Описание игрока"></textarea><button class="btn" id="add">Добавить карточку</button></div><div class="role-note" id="loginNote"></div></section>
<section class="server-columns"><div class="panel server-column"><div class="server-title"><h2>Пиратка</h2><span id="pirateCount"></span></div><div class="player-list" id="piratePlayers"></div></div><div class="panel server-column"><div class="server-title"><h2>Тайвань</h2><span id="taiwanCount"></span></div><div class="player-list" id="taiwanPlayers"></div></div></section></main>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function safeUrl(v){try{const u=new URL(String(v||'').trim());return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
async function imageToData(file,maxSide=1400){
  if(!file)return '';
  if(file.size>4*1024*1024)throw new Error('Файл больше 4 МБ');
  if(file.type==='image/gif'){
    if(file.size>2*1024*1024)throw new Error('GIF должен быть не больше 2 МБ');
    return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  }
  const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=raw});
  const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/webp',.84);
}
function openPreview(html){document.getElementById('previewContent').innerHTML=html;document.getElementById('previewModal').classList.add('open')}
function closePreview(){document.getElementById('previewModal').classList.remove('open')}

const u=JSON.parse(localStorage.getItem('kungfuCurrentUser')||'null');const isAdmin=!!u&&(u.role||'user')==='admin';const canUse=!!u&&(u.role==='admin'||u.role==='user');if(canUse){composer.classList.add('show');loginNote.textContent='Вы вошли в аккаунт. Можно добавить карточку и ставить ❤️.'}else loginNote.innerHTML='Гость может смотреть карточки. Чтобы добавить себя или поставить ❤️ — <a href="login.html" style="color:#ffe2a0">войдите</a>.';
let avatar='';image.onchange=async()=>{const f=image.files[0];if(!f)return;try{avatar=await imageToData(f)}catch(e){alert(e.message)}};
let players=JSON.parse(localStorage.getItem('kungfuPlayers')||'[]');function save(){localStorage.setItem('kungfuPlayers',JSON.stringify(players))}
function userKey(){return u?String(u.id||u.email||u.nickname):''}
function contactHtml(v){const value=String(v||'').trim();if(!value)return '';return safeUrl(value)?`<div class="contact"><b>Связаться:</b> <a href="${safeUrl(value)}" target="_blank" rel="noopener">${esc(value)}</a></div>`:`<div class="contact"><b>Связаться:</b> ${esc(value)}</div>`}
function card(x){const likes=Array.isArray(x.likes)?x.likes:[];const liked=canUse&&likes.includes(userKey());return `<article class="player">${x.avatar?`<img class="avatar" src="${x.avatar}" loading="lazy" decoding="async">`:'<div class="avatar"></div>'}<div><span class="tag">${esc(x.server)}</span><h3 style="margin:7px 0">${esc(x.nick)}</h3><div class="date">Добавлен: ${esc(x.createdAt||'Ранее')}</div><p class="muted">${esc(x.description||'').replace(/\n/g,'<br>')}</p>${contactHtml(x.contact)}<button class="heart ${liked?'liked':''}" ${canUse?'':'disabled'} onclick="toggleLike(${x.id})" title="${canUse?'Поставить или убрать ❤️':'Только для зарегистрированных'}">❤️ <span>${likes.length}</span></button>${u&&(isAdmin||u.nickname===x.owner)?`<div><button class="btn danger" onclick="delPlayer(${x.id})">Удалить</button></div>`:''}</div></article>`}
function render(){const p=players.filter(x=>x.server==='Пиратка').slice().reverse(),t=players.filter(x=>x.server==='Тайвань').slice().reverse();pirateCount.textContent=p.length+' игроков';taiwanCount.textContent=t.length+' игроков';piratePlayers.innerHTML=p.length?p.map(card).join(''):'<div class="empty">Игроков пока нет.</div>';taiwanPlayers.innerHTML=t.length?t.map(card).join(''):'<div class="empty">Игроков пока нет.</div>'}
add.onclick=()=>{if(!canUse)return;const n=nick.value.trim();if(!n){alert('Укажите никнейм');return}players.push({id:Date.now(),nick:n,server:server.value,contact:contact.value.trim(),description:description.value.trim(),avatar,owner:u.nickname,createdAt:new Date().toLocaleDateString('ru-RU'),likes:[]});save();avatar='';image.value='';nick.value='';contact.value='';description.value='';render()};
window.toggleLike=id=>{if(!canUse){alert('Поставить ❤️ могут только зарегистрированные пользователи.');return}const x=players.find(a=>a.id===id);if(!x)return;x.likes=Array.isArray(x.likes)?x.likes:[];const key=userKey(),i=x.likes.indexOf(key);if(i>=0)x.likes.splice(i,1);else x.likes.push(key);save();render()};
window.delPlayer=id=>{const x=players.find(a=>a.id===id);if(!x||!u||!(isAdmin||u.nickname===x.owner))return;if(!confirm('Удалить карточку игрока?'))return;players=players.filter(a=>a.id!==id);save();render()};
render();
</script><script src="image-tools-0.0.48.js?v=0.0.48"></script>
<script src="draft-recovery-0.0.62.js?v=0.0.62"></script>
