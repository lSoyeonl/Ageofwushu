<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Партнеры — Легенды Кунг-Фу</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>

:root{--gold:#e4b45e;--gold2:#ffe2a0;--line:rgba(228,180,94,.34);--muted:#bfd0d8;--deep:#071824}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#fff;font-family:"Oswald","Arial Narrow",Arial,sans-serif;background:linear-gradient(rgba(3,14,22,.72),rgba(3,14,22,.93)),url("background.png") center/cover fixed no-repeat}
a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}
.top{min-height:76px;padding:0 3.5vw;display:flex;align-items:center;gap:18px;background:rgba(3,16,26,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;color:var(--gold2);font-size:18px;font-weight:700}.brand img{width:52px;height:52px;object-fit:contain}
.nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.nav a{font-size:14px;font-weight:750}.nav a:hover{color:var(--gold2)}
.wrap{width:min(1220px,calc(100% - 30px));margin:34px auto 70px}
.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(5,27,40,.93),rgba(3,18,28,.96));box-shadow:0 16px 44px rgba(0,0,0,.27)}
.page-head{padding:22px 24px}h1,h2,h3,h4{color:var(--gold2)}h1{font-size:42px;margin:0}.muted{color:var(--muted)}
.editor{display:none;margin-top:14px;padding:16px;border:1px solid rgba(255,226,160,.2);border-radius:13px;background:rgba(3,21,32,.62)}.editor.show{display:block}
.field{margin-top:10px}label{display:block;margin-bottom:5px;color:#dce7eb;font-weight:700;font-size:13px}
input,textarea,select{width:100%;border:1px solid rgba(228,180,94,.28);border-radius:9px;background:#071824;color:#fff;outline:0;padding:10px 11px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:rgba(255,226,160,.78);box-shadow:0 0 0 3px rgba(228,180,94,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{min-height:40px;margin-top:10px;border:0;border-radius:9px;padding:0 14px;background:linear-gradient(#f3d28f,#cb9643);color:#251707;font-weight:900;cursor:pointer}
.btn.secondary{background:#153247;color:#ffe2a0;border:1px solid rgba(228,180,94,.24)}.btn.danger{background:#50252a;color:#ffd7d7;border:1px solid rgba(255,140,140,.2)}
.role-note{margin-top:10px;padding:9px 11px;border:1px solid rgba(126,204,234,.16);border-radius:9px;color:#bcd9e4;background:rgba(126,204,234,.05);font-size:12px}
.filebox{margin-top:10px;padding:10px;border:1px dashed rgba(228,180,94,.25);border-radius:10px;background:rgba(3,20,31,.46)}
.filebox img.preview{display:none;width:min(100%,340px);max-height:210px;object-fit:cover;margin-top:8px;border-radius:9px}.filebox img.preview.show{display:block}
.tag{display:inline-flex;padding:3px 7px;border-radius:999px;background:rgba(228,180,94,.1);border:1px solid rgba(228,180,94,.18);color:#ffe2a0;font-size:10px;font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 8px}.desc{color:#d6e2e7;line-height:1.55;font-size:14px}
.entry-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.empty{padding:26px;text-align:center;color:#9db0b8;border:1px dashed rgba(255,226,160,.18);border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:rgba(228,180,94,.08);border:1px solid rgba(228,180,94,.18);font-size:11px;color:#ffe2a0}.chip button{width:18px;height:18px;border:0;border-radius:50%;background:#51252a;color:#ffd7d7;cursor:pointer}
.preview-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.75);padding:22px;align-items:center;justify-content:center}.preview-modal.open{display:flex}.preview-box{width:min(900px,96vw);max-height:88vh;overflow:auto;padding:22px;border:1px solid rgba(228,180,94,.42);border-radius:18px;background:linear-gradient(180deg,#0a2636,#061721);box-shadow:0 25px 80px rgba(0,0,0,.55)}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}
@media(max-width:900px){.brand span{display:none}.top{align-items:flex-start;padding-top:10px;padding-bottom:10px}.nav{gap:8px}.nav a{font-size:12px}.grid3{grid-template-columns:1fr}}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}

.contacts-grid{display:grid;gap:14px;margin-top:16px}.contact{padding:18px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}.avatar{width:120px;height:120px;object-fit:cover;border-radius:12px;background:#071824;border:1px solid rgba(228,180,94,.16)}.mail{display:inline-flex;margin-top:7px;color:#9fdfff;text-decoration:underline}.contact-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.contact-link{display:inline-flex;padding:7px 10px;border-radius:8px;border:1px solid rgba(126,204,234,.18);background:rgba(126,204,234,.055);color:#9fdfff}.contact-text{color:#d4e2e8}.edit-note{display:none;color:#ffe2a0;margin:8px 0}.edit-note.show{display:block}
@media(max-width:620px){.contact{grid-template-columns:1fr}.avatar{width:100%;height:220px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head><body><header class="top"><a class="brand" href="index.html"><img src="logo.png"><span>Руководство Легенд Кунг-Фу</span></a><nav class="nav">

<main class="wrap"><section class="panel page-head"><h1>Партнеры</h1><p class="muted">Партнеры проекта и представители сообщества.</p><div class="role-note" id="roleNote"></div>
<div class="editor" id="editor"><h2 id="editorTitle">Добавить партнера</h2><div class="edit-note" id="editNote">Редактирование опубликованного партнера.</div>
<div class="grid2"><div class="field"><label>Никнейм</label><input id="nick"></div><div class="field"><label>Изображение</label><input id="img" type="file" accept="image/*"></div></div>
<div class="field"><label>Описание</label><textarea id="desc"></textarea></div>
<div class="grid2"><div class="field"><label>Вконтакте</label><input id="mainLink" placeholder="https://vk.com/..."></div><div class="field"><label>Дискорд</label><input id="discord" placeholder="Ссылка Discord или никнейм"></div></div>
<div class="field"><label>Почта</label><input id="email" type="email" placeholder="name@example.com"></div>
<img id="previewImage" class="avatar" style="display:none;margin-top:10px">
<button class="btn secondary" type="button" id="previewBtn">Предпросмотр</button><button class="btn" id="saveBtn">Добавить</button><button class="btn secondary" type="button" id="cancelBtn" style="display:none">Отменить</button>
</div></section><section class="contacts-grid" id="list"></section></main>
<div class="preview-modal" id="previewModal"><div class="preview-box"><div class="preview-head"><h2>Предпросмотр</h2><button class="btn danger" style="margin:0" onclick="closePreview()">Закрыть</button></div><div id="previewContent"></div></div></div>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function safeUrl(v){try{const u=new URL(String(v||'').trim());return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
async function imageToData(file,maxSide=1400){
  if(!file)return '';
  if(file.size>4*1024*1024)throw new Error('Файл больше 4 МБ');
  if(file.type==='image/gif'){
    if(file.size>2*1024*1024)throw new Error('GIF должен быть не больше 2 МБ');
    return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  }
  const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=raw});
  const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/webp',.84);
}
function openPreview(html){document.getElementById('previewContent').innerHTML=html;document.getElementById('previewModal').classList.add('open')}
function closePreview(){document.getElementById('previewModal').classList.remove('open')}

const u=JSON.parse(localStorage.getItem('kungfuCurrentUser')||'null'),isAdmin=!!u&&(u.role||'user')==='admin';
if(isAdmin){editor.classList.add('show');roleNote.textContent='Администратор может добавлять и редактировать опубликованные контакты.'}else roleNote.textContent='Редактирование доступно только администратору.';
let data=JSON.parse(localStorage.getItem('kungfuContacts')||'[]'),editingId=null,image='';
const img=document.getElementById('img'),previewImage=document.getElementById('previewImage');
img.onchange=async()=>{const f=img.files[0];if(!f)return;try{image=await imageToData(f);previewImage.src=image;previewImage.style.display='block'}catch(e){alert(e.message)}};
function save(){localStorage.setItem('kungfuContacts',JSON.stringify(data))}
function emailOf(x){return x.email||((x.extraLink||'').includes('@')?x.extraLink:'')}function vkOf(x){return x.vk||x.mainLink||''}function discordOf(x){return x.discord||''}
function contactValue(label,value){
  const v=String(value||'').trim();if(!v)return '';
  const url=safeUrl(v);
  return url?`<a class="contact-link" href="${url}" target="_blank" rel="noopener">${label}</a>`:`<span class="contact-link contact-text"><b>${label}:</b>&nbsp;${esc(v)}</span>`;
}
function card(x){const mail=emailOf(x),vk=vkOf(x),discord=discordOf(x);return `<article class="panel contact">${x.image?`<img class="avatar" src="${x.image}" loading="lazy">`:'<div class="avatar"></div>'}<div><h2 style="margin:0">${esc(x.nick)}</h2><p class="muted">${esc(x.desc||'')}</p><div class="contact-links">${contactValue('Вконтакте',vk)}${contactValue('Дискорд',discord)}</div>${mail?`<br><a class="mail" href="mailto:${esc(mail)}">${esc(mail)}</a>`:''}${isAdmin?`<div class="entry-actions"><button class="btn secondary" onclick="editContact(${x.id})">Редактировать</button><button class="btn danger" onclick="delContact(${x.id})">Удалить</button></div>`:''}</div></article>`}
function render(){list.innerHTML=data.length?data.map(card).join(''):'<div class="panel empty">Партнеры пока не добавлены.</div>'}
function reset(){editingId=null;image='';img.value='';previewImage.style.display='none';['nick','desc','mainLink','discord','email'].forEach(id=>document.getElementById(id).value='');editorTitle.textContent='Добавить партнера';editNote.classList.remove('show');saveBtn.textContent='Добавить';cancelBtn.style.display='none'}
window.editContact=id=>{if(!isAdmin)return;const x=data.find(a=>a.id===id);if(!x)return;editingId=id;nick.value=x.nick||'';desc.value=x.desc||'';mainLink.value=vkOf(x);discord.value=discordOf(x);email.value=emailOf(x);image=x.image||'';if(image){previewImage.src=image;previewImage.style.display='block'}editorTitle.textContent='Редактировать пользователя';editNote.classList.add('show');saveBtn.textContent='Сохранить изменения';cancelBtn.style.display='inline-flex';window.scrollTo({top:0,behavior:'smooth'})}
cancelBtn.onclick=reset;
previewBtn.onclick=()=>openPreview(card({id:'preview',nick:nick.value||'Никнейм',desc:desc.value,mainLink:mainLink.value,vk:mainLink.value,discord:discord.value,email:email.value,image}));
saveBtn.onclick=()=>{if(!isAdmin)return;const n=nick.value.trim(),link=mainLink.value.trim(),disc=discord.value.trim(),mail=email.value.trim();if(!n){alert('Укажите никнейм');return}const old=editingId?data.find(x=>x.id===editingId):null;const item={id:editingId||Date.now(),nick:n,desc:desc.value.trim(),mainLink:link,vk:link,discord:disc,email:mail,image:image||(old&&old.image)||''};if(editingId){const i=data.findIndex(x=>x.id===editingId);data[i]={...data[i],...item}}else data.push(item);save();reset();render()};
window.delContact=id=>{if(!isAdmin||!confirm('Удалить контакт?'))return;data=data.filter(x=>x.id!==id);if(editingId===id)reset();save();render()};
render();
</script><script src="image-tools-0.0.48.js?v=0.0.48"></script>
<script src="decor-0.0.48.js?v=0.0.48"></script>
