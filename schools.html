<style>

:root{--gold:#e4b45e;--gold2:#ffe2a0;--line:rgba(228,180,94,.34);--muted:#bfd0d8;--deep:#071824}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#fff;font-family:"Oswald","Arial Narrow",Arial,sans-serif;background:linear-gradient(rgba(3,14,22,.72),rgba(3,14,22,.93)),url("background.webp") center/cover fixed no-repeat}
a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}
.top{min-height:76px;padding:0 3.5vw;display:flex;align-items:center;gap:18px;background:rgba(3,16,26,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;color:var(--gold2);font-size:18px;font-weight:700}.brand img{width:52px;height:52px;object-fit:contain}
.nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.nav a{font-size:14px;font-weight:750}.nav a:hover{color:var(--gold2)}
.wrap{width:min(1220px,calc(100% - 30px));margin:34px auto 70px}
.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(5,27,40,.93),rgba(3,18,28,.96));box-shadow:0 16px 44px rgba(0,0,0,.27)}
.page-head{padding:22px 24px}h1,h2,h3,h4{color:var(--gold2)}h1{font-size:42px;margin:0}.muted{color:var(--muted)}
.editor{display:none;margin-top:14px;padding:16px;border:1px solid rgba(255,226,160,.2);border-radius:13px;background:rgba(3,21,32,.62)}.editor.show{display:block}
.field{margin-top:10px}label{display:block;margin-bottom:5px;color:#dce7eb;font-weight:700;font-size:13px}
input,textarea,select{width:100%;border:1px solid rgba(228,180,94,.28);border-radius:9px;background:#071824;color:#fff;outline:0;padding:10px 11px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:rgba(255,226,160,.78);box-shadow:0 0 0 3px rgba(228,180,94,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{min-height:40px;margin-top:10px;border:0;border-radius:9px;padding:0 14px;background:linear-gradient(#f3d28f,#cb9643);color:#251707;font-weight:900;cursor:pointer}
.btn.secondary{background:#153247;color:#ffe2a0;border:1px solid rgba(228,180,94,.24)}.btn.danger{background:#50252a;color:#ffd7d7;border:1px solid rgba(255,140,140,.2)}
.role-note{margin-top:10px;padding:9px 11px;border:1px solid rgba(126,204,234,.16);border-radius:9px;color:#bcd9e4;background:rgba(126,204,234,.05);font-size:12px}
.filebox{margin-top:10px;padding:10px;border:1px dashed rgba(228,180,94,.25);border-radius:10px;background:rgba(3,20,31,.46)}
.filebox img.preview{display:none;width:min(100%,340px);max-height:210px;object-fit:cover;margin-top:8px;border-radius:9px}.filebox img.preview.show{display:block}
.tag{display:inline-flex;padding:3px 7px;border-radius:999px;background:rgba(228,180,94,.1);border:1px solid rgba(228,180,94,.18);color:#ffe2a0;font-size:10px;font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 8px}.desc{color:#d6e2e7;line-height:1.55;font-size:14px}
.entry-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.empty{padding:26px;text-align:center;color:#9db0b8;border:1px dashed rgba(255,226,160,.18);border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:rgba(228,180,94,.08);border:1px solid rgba(228,180,94,.18);font-size:11px;color:#ffe2a0}.chip button{width:18px;height:18px;border:0;border-radius:50%;background:#51252a;color:#ffd7d7;cursor:pointer}
.preview-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.75);padding:22px;align-items:center;justify-content:center}.preview-modal.open{display:flex}.preview-box{width:min(900px,96vw);max-height:88vh;overflow:auto;padding:22px;border:1px solid rgba(228,180,94,.42);border-radius:18px;background:linear-gradient(180deg,#0a2636,#061721);box-shadow:0 25px 80px rgba(0,0,0,.55)}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}
@media(max-width:900px){.brand span{display:none}.top{align-items:flex-start;padding-top:10px;padding-bottom:10px}.nav{gap:8px}.nav a{font-size:12px}.grid3{grid-template-columns:1fr}}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}

.school-layout{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-top:16px}.school-nav{padding:14px;position:sticky;top:94px;align-self:start}.school-nav h2{margin:12px 0 6px;font-size:20px}.school-nav a{display:block;padding:8px 9px;border-radius:8px;background:rgba(255,255,255,.025);margin-top:5px}.school-content{display:grid;gap:14px}.school-card{padding:18px}.school-main{display:grid;grid-template-columns:190px 1fr;gap:18px}.school-img{width:190px;height:190px;object-fit:cover;border-radius:12px;background:#071824}.school-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.school-info-box{padding:11px;border:1px solid rgba(228,180,94,.14);border-radius:10px;background:rgba(255,255,255,.025)}.school-info-box h3{margin:0 0 6px;font-size:17px}.repeat-builders{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.builder{padding:12px;border:1px solid rgba(228,180,94,.15);border-radius:10px;background:rgba(255,255,255,.02)}.draft-list,.published-list{display:grid;gap:8px;margin-top:9px}.mini-card{display:grid;grid-template-columns:72px 1fr;gap:9px;padding:9px;border:1px solid rgba(228,180,94,.14);border-radius:9px;background:rgba(255,255,255,.025)}.mini-card img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#061721}.mini-card h4{margin:0 0 4px}.mini-card p{margin:0;color:#c8d7dd;font-size:12px}.links-box{margin-top:12px}.required{color:#ffb6b6;font-size:11px}
@media(max-width:900px){.school-layout{grid-template-columns:1fr}.school-nav{position:relative;top:auto}.repeat-builders{grid-template-columns:1fr}}@media(max-width:650px){.school-main,.school-info-grid{grid-template-columns:1fr}.school-img{width:100%;height:240px}}

</head><body><header class="top"><a class="brand" href="index.html"><img src="logo.png"><span>Руководство Легенд Кунг-Фу</span></a><nav class="nav">

<main class="wrap"><section class="panel page-head"><h1>Школы, Силы, Секты</h1><div class="role-note" id="roleNote"></div><div class="editor" id="editor"><h2 id="editorTitle">Добавить материал</h2>
<div class="grid2"><div class="field"><label>Раздел</label><select id="category"><option>Школа</option><option>Сила</option><option>Секта</option></select></div><div class="field"><label>Название</label><input id="name"></div></div><div class="grid2"><div class="field"><label>Описание</label><textarea id="contentText" style="min-height:150px"></textarea></div><div class="field"><label>Как вступить?</label><textarea id="howToJoin" style="min-height:150px" placeholder="Условия, NPC, квест, координаты и другие шаги"></textarea></div></div>
<div class="filebox"><label>Основное изображение</label><input id="imageInput" type="file" accept="image/*"><img class="preview" id="imagePreview"></div>
<div class="repeat-builders">
<div class="builder"><h3>Нейгуны</h3><div class="field"><label>Название Нейгуна</label><input id="neigongName"></div><div class="field"><label>Описание</label><textarea id="neigongDesc"></textarea></div><div class="field"><label>Изображение <span class="required">обязательно для новой записи</span></label><input id="neigongImage" type="file" accept="image/*"></div><button class="btn secondary" type="button" id="addNeigong">Добавить Нейгун</button><div class="draft-list" id="neigongDraft"></div></div>
<div class="builder"><h3>Навыки</h3><div class="field"><label>Название Навыка</label><input id="skillName"></div><div class="field"><label>Описание</label><textarea id="skillDesc"></textarea></div><div class="field"><label>Изображение <span class="required">обязательно</span></label><input id="skillImage" type="file" accept="image/*"></div><button class="btn secondary" type="button" id="addSkill">Добавить Навык</button><div class="draft-list" id="skillDraft"></div></div>
</div>
<div class="field links-box"><label>Ссылки (Название | URL, по одной на строку)</label><textarea id="links"></textarea></div>
<button class="btn secondary" type="button" id="previewBtn">Предпросмотр</button><button class="btn" id="saveBtn">Добавить</button><button class="btn secondary" type="button" id="cancelBtn" style="display:none">Отменить</button>
</div></section><div class="school-layout"><aside class="panel school-nav" id="schoolNav"></aside><section class="school-content" id="schoolContent"></section></div></main>
<div class="preview-modal" id="previewModal"><div class="preview-box"><div class="preview-head"><h2>Предпросмотр</h2><button class="btn danger" style="margin:0" onclick="closePreview()">Закрыть</button></div><div id="previewContent"></div></div></div>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function safeUrl(v){try{const u=new URL(String(v||'').trim());return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
async function imageToData(file,maxSide=1400){
  if(!file)return '';
  if(file.size>4*1024*1024)throw new Error('Файл больше 4 МБ');
  if(file.type==='image/gif'){
    if(file.size>2*1024*1024)throw new Error('GIF должен быть не больше 2 МБ');
    return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  }
  const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=raw});
  const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/webp',.84);
}
function openPreview(html){document.getElementById('previewContent').innerHTML=html;document.getElementById('previewModal').classList.add('open')}
function closePreview(){document.getElementById('previewModal').classList.remove('open')}

const u=JSON.parse(localStorage.getItem('kungfuCurrentUser')||'null'),isAdmin=!!u&&(u.role||'user')==='admin';if(isAdmin){editor.classList.add('show');roleNote.textContent='Администратор может добавлять и редактировать опубликованный контент.'}else roleNote.textContent='Редактирование доступно только администратору.';
let data=JSON.parse(localStorage.getItem('kungfuSchoolsForcesSects')||'[]'),editingId=null,mainImage='',draftNeigongs=[],draftSkills=[];
imageInput.onchange=async()=>{const f=imageInput.files[0];if(!f)return;try{mainImage=await imageToData(f);imagePreview.src=mainImage;imagePreview.classList.add('show')}catch(e){alert(e.message)}};
function save(){localStorage.setItem('kungfuSchoolsForcesSects',JSON.stringify(data))}function lines(v){return String(v||'').split(/\n+/).map(x=>x.trim()).filter(Boolean)}
function legacyCards(v){return lines(v).map(name=>({name,description:'',image:''}))}
function getNeigongs(x){return Array.isArray(x.neigongCards)?x.neigongCards:legacyCards(x.neigongs)}function getSkills(x){return Array.isArray(x.skillCards)?x.skillCards:legacyCards(x.skills)}
function draftHtml(arr,kind){return arr.length?arr.map((x,i)=>`<div class="mini-card">${x.image?`<img src="${x.image}" loading="lazy" decoding="async">`:'<div style="width:72px;height:72px;background:#061721;border-radius:8px"></div>'}<div><h4>${esc(x.name)}</h4><p>${esc(x.description||'')}</p><button class="btn danger" style="min-height:30px;margin-top:5px" type="button" onclick="removeDraft('${kind}',${i})">Убрать</button></div></div>`).join(''):'<div class="muted" style="font-size:12px">Пока не добавлено.</div>'}
function renderDrafts(){neigongDraft.innerHTML=draftHtml(draftNeigongs,'n');skillDraft.innerHTML=draftHtml(draftSkills,'s')}window.removeDraft=(k,i)=>{(k==='n'?draftNeigongs:draftSkills).splice(i,1);renderDrafts()};
addNeigong.onclick=async()=>{const n=neigongName.value.trim(),d=neigongDesc.value.trim(),f=neigongImage.files[0];if(!n){alert('Укажите название Нейгуна');return}if(!f){alert('Для нового Нейгуна обязательно изображение.');return}try{draftNeigongs.push({name:n,description:d,image:await imageToData(f,1000)});neigongName.value='';neigongDesc.value='';neigongImage.value='';renderDrafts()}catch(e){alert(e.message)}};
addSkill.onclick=async()=>{const n=skillName.value.trim(),d=skillDesc.value.trim(),f=skillImage.files[0];if(!n){alert('Укажите название Навыка');return}if(!f){alert('Для нового Навыка обязательно изображение.');return}try{draftSkills.push({name:n,description:d,image:await imageToData(f,1000)});skillName.value='';skillDesc.value='';skillImage.value='';renderDrafts()}catch(e){alert(e.message)}};
function published(title,arr){return arr.length?`<div class="builder" style="margin-top:12px"><h3>${title}</h3><div class="published-list">${arr.map(x=>`<div class="mini-card">${x.image?`<img src="${x.image}" loading="lazy" decoding="async">`:'<div style="width:72px;height:72px;background:#061721;border-radius:8px"></div>'}<div><h4>${esc(x.name)}</h4><p>${esc(x.description||'')}</p></div></div>`).join('')}</div></div>`:''}
function renderLinks(v){const a=lines(v);return a.length?`<div class="builder links-box"><h3>Ссылки</h3><ul>${a.map(line=>{const p=line.split('|'),url=safeUrl((p[1]||p[0]).trim()),label=(p[1]?p[0]:'Перейти').trim();return url?`<li><a href="${url}" target="_blank" rel="noopener">${esc(label)}</a></li>`:`<li>${esc(line)}</li>`}).join('')}</ul></div>`:''}
function card(x){return `<article class="panel school-card" id="entry-${x.id}"><div class="school-main">${x.image?`<img class="school-img" src="${x.image}" loading="lazy" decoding="async">`:'<div class="school-img"></div>'}<div><span class="tag">${esc(x.category)}</span><h2>${esc(x.name)}</h2><div class="school-info-grid"><div class="school-info-box"><h3>Описание</h3><div class="desc">${esc(x.content||'Описание пока не заполнено.').replace(/\n/g,'<br>')}</div></div><div class="school-info-box"><h3>Как вступить?</h3><div class="desc">${esc(x.howToJoin||'Информация пока не добавлена.').replace(/\n/g,'<br>')}</div></div></div>${published('Нейгуны',getNeigongs(x))}${published('Навыки',getSkills(x))}${renderLinks(x.links)}${isAdmin?`<div class="entry-actions"><button class="btn secondary" onclick="editEntry(${x.id})">Редактировать</button><button class="btn danger" onclick="delEntry(${x.id})">Удалить</button></div>`:''}</div></div></article>`}
function render(){const cats=[['Школа','Школы'],['Сила','Силы'],['Секта','Секты']];schoolNav.innerHTML=cats.map(([c,l])=>`<h2>${l}</h2>${data.filter(x=>x.category===c).map(x=>`<a href="#entry-${x.id}">${esc(x.name)}</a>`).join('')||'<div class="muted">Пока пусто</div>'}`).join('');schoolContent.innerHTML=data.length?data.map(card).join(''):'<div class="panel empty">Материалы пока не добавлены.</div>'}
function reset(){editingId=null;mainImage='';imageInput.value='';imagePreview.classList.remove('show');name.value='';contentText.value='';howToJoin.value='';links.value='';draftNeigongs=[];draftSkills=[];renderDrafts();editorTitle.textContent='Добавить материал';saveBtn.textContent='Добавить';cancelBtn.style.display='none'}
window.editEntry=id=>{if(!isAdmin)return;const x=data.find(a=>a.id===id);if(!x)return;editingId=id;category.value=x.category;name.value=x.name||'';contentText.value=x.content||'';howToJoin.value=x.howToJoin||'';links.value=x.links||'';draftNeigongs=getNeigongs(x).map(a=>({...a}));draftSkills=getSkills(x).map(a=>({...a}));mainImage=x.image||'';if(mainImage){imagePreview.src=mainImage;imagePreview.classList.add('show')}renderDrafts();editorTitle.textContent='Редактировать материал';saveBtn.textContent='Сохранить изменения';cancelBtn.style.display='inline-flex';window.scrollTo({top:0,behavior:'smooth'})};cancelBtn.onclick=reset;
previewBtn.onclick=()=>openPreview(card({id:'preview',category:category.value,name:name.value||'Без названия',content:contentText.value,howToJoin:howToJoin.value,links:links.value,image:mainImage,neigongCards:draftNeigongs,skillCards:draftSkills}));
saveBtn.onclick=()=>{if(!isAdmin)return;const n=name.value.trim(),c=contentText.value.trim();if(!n||!c){alert('Заполните название и содержание');return}const old=editingId?data.find(x=>x.id===editingId):null;const item={id:editingId||Date.now(),category:category.value,name:n,content:c,howToJoin:howToJoin.value.trim(),links:links.value.trim(),image:mainImage||(old&&old.image)||'',neigongCards:draftNeigongs.map(x=>({...x})),skillCards:draftSkills.map(x=>({...x}))};if(editingId){const i=data.findIndex(x=>x.id===editingId);data[i]={...data[i],...item}}else data.push(item);save();reset();render()};
window.delEntry=id=>{if(!isAdmin||!confirm('Удалить материал?'))return;data=data.filter(x=>x.id!==id);if(editingId===id)reset();save();render()};renderDrafts();render();
</script><script src="image-tools-0.0.48.js?v=0.0.70"></script>
<script src="draft-recovery-0.0.62.js?v=0.0.62"></script>
