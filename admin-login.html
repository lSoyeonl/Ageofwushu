<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход администратора — Легенды Кунг-Фу</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<style>
:root{--gold:#e4b45e;--gold2:#ffe2a0;--line:rgba(228,180,94,.38)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#fff;font-family:"Oswald","Arial Narrow",Arial,sans-serif;background:linear-gradient(rgba(3,14,22,.72),rgba(3,14,22,.9)),url("background-night-0.0.99.webp") center/cover no-repeat fixed}
.card{width:min(460px,100%);padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(5,27,40,.96),rgba(3,18,28,.98));box-shadow:0 26px 80px rgba(0,0,0,.48)}
h1{margin:0;color:var(--gold2);font:500 38px Georgia,serif}
p{color:#cbd9df;line-height:1.55}
label{display:block;margin:14px 0 7px;font-weight:700;color:#dce7eb}
input{width:100%;height:48px;border:1px solid rgba(228,180,94,.35);border-radius:10px;background:#071824;color:#fff;padding:0 13px;outline:0}
button,a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:16px;padding:0 18px;border:0;border-radius:11px;background:linear-gradient(#f3d28f,#cb9643);color:#251707;font-weight:900;text-decoration:none;cursor:pointer}
.err{min-height:20px;margin-top:10px;color:#ffb8a8;font-size:13px}
.note{margin-top:18px;padding:12px;border:1px solid rgba(120,205,236,.18);border-radius:11px;background:rgba(120,205,236,.06);color:#bad6e0;font-size:12px;line-height:1.5}
</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=0.0.48"></script>
<script src="storage-config.js?v=0.0.76"></script>
<script src="supabase-sync.js?v=0.0.85"></script>
<link rel="stylesheet" href="site-core-0.0.66.css?v=0.0.93">
<link rel="stylesheet" href="patch-0.1.26.css?v=0.1.26">
</head>
<body>
<div class="card">
  <h1>Вход администратора</h1>
  <p>Администратор может публиковать и редактировать материалы сайта. Обычные игроки — только создавать обсуждения и ответы на форуме.</p>
  <label>Логин или e-mail</label>
  <input id="login" autocomplete="username" placeholder="admin">
  <label>Пароль</label>
  <input id="pass" type="password" autocomplete="current-password" placeholder="Введите пароль">
  <button id="go">Войти как администратор</button>
  <div class="err" id="err"></div>
  <div class="note">Права администратора проверяются через роль профиля в Supabase.</div>
  <a class="btn" href="index.html" style="background:#153247;color:#ffe2a0;border:1px solid rgba(228,180,94,.28)">← На главную</a><a class="btn" href="partners.html" style="margin-left:8px;background:#153247;color:#ffe2a0;border:1px solid rgba(228,180,94,.28)">Партнеры</a>
</div>


<script>
document.getElementById('go').addEventListener('click',async()=>{
  const login=document.getElementById('login').value.trim();
  const password=document.getElementById('pass').value;
  const err=document.getElementById('err');

  if(!KFSupabase.configured){
    err.textContent='Центральный сервис аккаунтов администратора ещё не подключён. Проверьте настройку Supabase перед публикацией сайта.';
    return;
  }

  err.textContent='Проверка прав...';
  try{
    await KFSupabase.adminLogin(login,password);
    location.href='admin-backups.html';
  }catch(e){
    err.textContent=e.message||'Не удалось войти как администратор.';
  }
});
</script>
<script src="site-effects-0.0.66.js?v=0.0.66"></script>
</body>
</html>
