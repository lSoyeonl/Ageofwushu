<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Питомцы — Легенды Кунг-Фу</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--gold:#e4b45e;--gold2:#ffe2a0;--line:rgba(228,180,94,.34);--muted:#bfd0d8;--deep:#071824;--danger:#ffb5b5}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#fff;font-family:"Oswald","Arial Narrow",Arial,sans-serif;background:linear-gradient(rgba(3,14,22,.72),rgba(3,14,22,.94)),url("background-night-0.0.99.webp") center/cover fixed no-repeat}
a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}
.top{min-height:76px;padding:0 3.5vw;display:flex;align-items:center;gap:18px;background:rgba(3,16,26,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;color:var(--gold2);font-size:18px;font-weight:700}.brand img{width:52px;height:52px;object-fit:contain}
.nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.nav a{font-size:14px;font-weight:750}.nav a:hover,.nav a.active{color:var(--gold2)}
.wrap{width:min(1500px,calc(100% - 30px));margin:34px auto 70px}.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(5,27,40,.94),rgba(3,18,28,.97));box-shadow:0 16px 44px rgba(0,0,0,.28)}
.page-head{padding:22px 24px}.page-head h1{font-size:42px;margin:0;color:var(--gold2)}.muted{color:var(--muted);line-height:1.55}.role-note,.save-status{margin-top:10px;padding:9px 11px;border:1px solid rgba(126,204,234,.16);border-radius:9px;color:#bcd9e4;background:rgba(126,204,234,.05);font-size:13px}.save-status:empty{display:none}
.admin-badge{display:inline-flex;align-items:center;padding:4px 9px;border:1px solid rgba(255,226,160,.34);border-radius:999px;background:rgba(228,180,94,.08);color:var(--gold2);font-size:11px;font-weight:900;letter-spacing:.05em}
.toolbar{margin-top:16px;display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:10px;align-items:center}.search{width:100%;min-height:42px;border:1px solid rgba(228,180,94,.28);border-radius:10px;background:#071824;color:#fff;outline:0;padding:10px 12px}.search:focus{border-color:rgba(255,226,160,.78);box-shadow:0 0 0 3px rgba(228,180,94,.06)}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{min-height:40px;border:0;border-radius:9px;padding:0 14px;background:linear-gradient(#f3d28f,#cb9643);color:#251707;font-weight:800;cursor:pointer}.btn.secondary{background:#153247;color:#ffe2a0;border:1px solid rgba(228,180,94,.24)}.btn.danger{background:#50252a;color:#ffd7d7;border:1px solid rgba(255,140,140,.2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.table-panel{margin-top:16px;padding:0;overflow:hidden}.table-top{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(228,180,94,.18)}.result-count{color:#b9ccd4;font-size:13px}.table-wrap{width:100%;overflow:auto;max-height:74vh;scrollbar-width:thin;scrollbar-color:#8fd8ff #081b29;scrollbar-gutter:stable both-edges}
.pets-table{width:auto;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:900px}.pets-table th,.pets-table td{padding:12px 14px;border-right:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle;text-align:center}.pets-table th{position:sticky;top:0;z-index:4;background:#0a2839;color:#ffe2a0;font-size:12px;white-space:nowrap;overflow:visible}.pets-table th .th-label{display:block;overflow:hidden;text-overflow:ellipsis;padding-right:8px;text-align:center}.pets-table td{font-size:14px;color:#dce8ed;background:rgba(5,25,37,.78);overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5;overflow:hidden}.pets-table tbody tr:nth-child(even) td{background:rgba(7,31,44,.82)}.pets-table tbody tr:hover td{background:rgba(17,51,66,.9)}.pets-table tbody tr.staff-row{cursor:pointer}.pets-table th:last-child,.pets-table td:last-child{position:sticky;right:0;z-index:5;box-shadow:-8px 0 18px rgba(0,0,0,.12)}.pets-table th:last-child{z-index:8;background:#0a2839}.pets-table td:last-child{background:#082131}.pets-table tbody tr:nth-child(even) td:last-child{background:#0a2939}.pets-table tbody tr:hover td:last-child{background:#113342}
.pet-picture{width:112px;height:112px;display:block;object-fit:contain;object-position:center;margin:0 auto;border-radius:12px;border:1px solid rgba(228,180,94,.18);background:rgba(1,10,16,.72);box-shadow:0 8px 20px rgba(0,0,0,.18)}.pet-picture-empty{width:112px;height:86px;margin:0 auto;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(228,180,94,.20);border-radius:12px;color:#8299a4;background:rgba(1,10,16,.38);font-size:12px}.pet-name{font-weight:900;color:#ffe2a0}.author-line{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.author-name{color:#dff3fb;font-weight:800}.resize-handle{position:absolute;top:0;right:-5px;width:11px;height:100%;cursor:col-resize;z-index:14;touch-action:none}.resize-handle:after{content:"";position:absolute;top:14%;bottom:14%;left:5px;width:2px;border-radius:2px;background:rgba(255,226,160,.46)}.resize-handle:hover:after,.resize-handle.dragging:after{background:#ffe2a0;box-shadow:0 0 8px rgba(255,226,160,.35)}.empty{padding:34px;text-align:center;color:#9db0b8}
.editor-backdrop{display:none;position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.72);padding:22px;align-items:center;justify-content:center}.editor-backdrop.open{display:flex}.editor-box{width:min(760px,96vw);max-height:90vh;overflow:auto;padding:20px;border:1px solid rgba(228,180,94,.4);border-radius:16px;background:linear-gradient(180deg,#0a2636,#061721);box-shadow:0 25px 80px rgba(0,0,0,.55)}.editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.editor-head h2{margin:0;color:#ffe2a0}.close-btn{width:38px;height:38px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#102c3d;color:#fff;cursor:pointer;font-size:20px}.field{margin-top:12px}label{display:block;margin-bottom:5px;color:#dce7eb;font-weight:700;font-size:13px}input,textarea{width:100%;border:1px solid rgba(228,180,94,.28);border-radius:9px;background:#071824;color:#fff;outline:0;padding:10px 11px}textarea{min-height:130px;resize:vertical}input:focus,textarea:focus{border-color:rgba(255,226,160,.78);box-shadow:0 0 0 3px rgba(228,180,94,.06)}.required{color:#ffb6b6}.image-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.editor-preview{display:none;width:min(280px,100%);height:210px;object-fit:contain;object-position:center;margin:10px auto 0;border-radius:12px;border:1px solid rgba(228,180,94,.18);background:#061722}.editor-preview.show{display:block}.editor-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
@media(max-width:900px){.brand span{display:none}.top{align-items:flex-start;padding-top:10px;padding-bottom:10px}.nav{gap:8px}.nav a{font-size:12px}.toolbar{grid-template-columns:1fr}.toolbar-actions{justify-content:flex-start}}
@media(max-width:650px){.wrap{width:min(100% - 18px,1500px);margin-top:18px}.page-head{padding:17px}.page-head h1{font-size:32px}.editor-backdrop{padding:8px}.editor-box{padding:15px}.table-top{align-items:flex-start;flex-direction:column}.pet-picture{width:92px;height:92px}}
</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=0.0.48"></script><script src="storage-config.js?v=0.0.76"></script><script src="supabase-sync.js?v=0.0.84"></script><script src="image-tools-0.0.48.js?v=0.0.48"></script>

</head>
<body>
<header class="top"><a class="brand" href="index.html"><img src="logo.png" alt="Логотип"><span>Руководство Легенд Кунг-Фу</span></a><nav class="nav"><a href="index.html">Главная</a><a href="schools.html">Школы / Секты / Фракции</a><a href="game-stats.html">Характеристики</a><a class="active" href="pets.html">Питомцы</a><a href="lanterns.html">Фонари</a>
<a href="forum.html">Форум</a><a href="login.html">Вход</a></nav></header>
<main class="wrap">
  <section class="panel page-head">
    <h1>Питомцы</h1>
    <p class="muted">Справочник питомцев. Все колонки выровнены по центру. Администратор и модератор могут добавлять, редактировать и удалять записи.</p>
    <div class="role-note" id="roleNote">Загрузка...</div>
    <div class="toolbar"><input class="search" id="searchInput" type="search" placeholder="Поиск по названию, особенности или автору..."><div class="toolbar-actions" id="staffActions" style="display:none"><button class="btn" type="button" id="addRowBtn">+ Добавить питомца</button></div></div>
    <div class="save-status" id="saveStatus"></div>
  </section>
  <section class="panel table-panel"><div class="table-top"><strong>Питомцы</strong><span class="result-count" id="resultCount"></span></div><div class="table-wrap" id="petsTableWrap"><table class="pets-table" id="petsTable"><colgroup id="petsCols"></colgroup><thead id="petsHead"></thead><tbody id="petsBody"></tbody></table></div></section>
</main>
<div class="editor-backdrop" id="editorBackdrop" aria-hidden="true"><div class="editor-box"><div class="editor-head"><h2 id="editorTitle">Добавить питомца</h2><button class="close-btn" id="closeEditorBtn" type="button">×</button></div><div class="field"><label>Картинка</label><input id="imageInput" type="file" accept="image/*"><div class="image-tools"><button class="btn secondary" type="button" id="removeImageBtn">Убрать картинку</button></div><img id="imagePreview" class="editor-preview" alt="Предпросмотр"></div><div class="field"><label>Название <span class="required">*</span></label><input id="nameInput" maxlength="500" placeholder="Название питомца"></div><div class="field"><label>Особенность</label><textarea id="featureInput" maxlength="12000" placeholder="Опишите особенность питомца"></textarea></div><div class="editor-actions"><button class="btn danger" type="button" id="deleteBtn" style="display:none">Удалить</button><button class="btn secondary" type="button" id="cancelBtn">Отмена</button><button class="btn" type="button" id="saveBtn">Сохранить</button></div></div></div>
<script>
(()=>{
const KEY='kungfuPets'; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let currentUser=null,isStaff=false,state={version:1,rows:[],widths:{}},editingId=null,saving=false,resizing=null,pendingImage='';
const MIN_WIDTH=100,MAX_WIDTH=900,DEFAULT_WIDTHS={image:190,name:270,feature:620,author:240};
const uid=()=>`pet-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
function normalize(v){const rows=Array.isArray(v?.rows)?v.rows:[];const widths={...DEFAULT_WIDTHS};if(v?.widths&&typeof v.widths==='object')Object.entries(v.widths).forEach(([k,val])=>{const n=Number(val);if(Number.isFinite(n)&&k in widths)widths[k]=Math.max(MIN_WIDTH,Math.min(MAX_WIDTH,Math.round(n))) });return{version:1,widths,rows:rows.map(r=>({id:String(r.id||uid()),image:String(r.image||''),name:String(r.name||''),feature:String(r.feature||''),author:String(r.author||''),authorRole:String(r.authorRole||''),createdAt:r.createdAt||null,updatedAt:r.updatedAt||null}))}}
function widthOf(id){const n=Number(state.widths?.[id]);return Number.isFinite(n)?Math.max(MIN_WIDTH,Math.min(MAX_WIDTH,Math.round(n))):DEFAULT_WIDTHS[id]}
function defs(){return[{id:'image',label:'Картинка'},{id:'name',label:'Название'},{id:'feature',label:'Особенность'},{id:'author',label:'Добавил'}]}
function renderTableStructure(){const cols=defs();$('petsCols').innerHTML=cols.map(c=>`<col data-col-id="${c.id}" style="width:${widthOf(c.id)}px">`).join('');$('petsHead').innerHTML='<tr>'+cols.map(c=>`<th data-col-id="${c.id}"><span class="th-label">${c.label}</span>${isStaff?`<span class="resize-handle" data-resize="${c.id}" title="Изменить ширину"></span>`:''}</th>`).join('')+'</tr>';const total=cols.reduce((s,c)=>s+widthOf(c.id),0);$('petsTable').style.width=Math.max(total,$('petsTableWrap')?.clientWidth||0,900)+'px'}
function roleText(){if(!currentUser)return 'Просмотр доступен всем. Добавлять и редактировать питомцев могут Администратор и Модератор.';if(isStaff)return `<span class="admin-badge">${currentUser.role==='moderator'?'МОДЕРАТОР':'АДМИН'}</span> Доступно добавление, редактирование и удаление питомцев.`;return `Вы вошли как ${esc(currentUser.nickname||currentUser.email||'пользователь')}. Раздел доступен только для просмотра.`}
function setStatus(text,error=false){$('saveStatus').textContent=text||'';$('saveStatus').style.color=error?'#ffb5b5':'#bcd9e4'}
function authorHtml(r){const badge=window.KFStaffBadge?.(r.authorRole||'')||'';return `<div class="author-line"><span class="author-name">${esc(r.author||'—')}</span>${badge}</div>`}
function imageHtml(r){return r.image?`<img class="pet-picture" src="${esc(r.image)}" alt="${esc(r.name)}" loading="lazy" decoding="async">`:'<div class="pet-picture-empty">Нет картинки</div>'}
function render(){renderTableStructure();const q=$('searchInput').value.trim().toLocaleLowerCase();const rows=state.rows.filter(r=>!q||[r.name,r.feature,r.author].join(' ').toLocaleLowerCase().includes(q));$('resultCount').textContent=`${rows.length} из ${state.rows.length}`;$('petsBody').innerHTML=rows.length?rows.map(r=>`<tr${isStaff?` class="staff-row" data-id="${esc(r.id)}" title="Нажмите, чтобы редактировать"`:''}><td>${imageHtml(r)}</td><td class="pet-name">${esc(r.name)||'—'}</td><td>${esc(r.feature)||'—'}</td><td>${authorHtml(r)}</td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">${q?'Ничего не найдено.':'Питомцев пока нет.'}</div></td></tr>`}
async function persist(msg){if(!isStaff)throw new Error('Недостаточно прав.');saving=true;setStatus('Сохранение...');try{const saved=await KFSupabase.saveStore(KEY,state);state=normalize(saved||state);render();setStatus(msg)}catch(e){setStatus(e?.message||String(e),true);throw e}finally{saving=false}}
function preview(value){const p=$('imagePreview');if(value){p.src=value;p.classList.add('show')}else{p.removeAttribute('src');p.classList.remove('show')}}
async function fileToImage(file){if(!file)return'';if(window.KFImageTools?.process)return await window.KFImageTools.process(file,{maxSide:1200,preserveBytes:2.2*1024*1024,targetBytes:1.2*1024*1024});return await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)})}
function openEditor(id=null){if(!isStaff)return;editingId=id;const r=id?state.rows.find(x=>x.id===id):null;pendingImage=r?.image||'';$('editorTitle').textContent=r?'Редактировать питомца':'Добавить питомца';$('nameInput').value=r?.name||'';$('featureInput').value=r?.feature||'';$('imageInput').value='';$('deleteBtn').style.display=r?'inline-flex':'none';preview(pendingImage);$('editorBackdrop').classList.add('open');$('editorBackdrop').setAttribute('aria-hidden','false');setTimeout(()=>$('nameInput').focus(),30)}
function closeEditor(){$('editorBackdrop').classList.remove('open');$('editorBackdrop').setAttribute('aria-hidden','true');editingId=null;pendingImage='';$('imageInput').value='';preview('')}
async function saveEditor(){if(!isStaff)return;const name=$('nameInput').value.trim(),feature=$('featureInput').value.trim();if(!name){setStatus('Укажите название питомца.',true);return}const old=editingId?state.rows.find(r=>r.id===editingId):null;const row={id:old?.id||uid(),image:pendingImage,name,feature,author:old?.author||currentUser?.nickname||currentUser?.email||'',authorRole:old?.authorRole||currentUser?.role||'admin',createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(old)state.rows=state.rows.map(r=>r.id===old.id?row:r);else state.rows=[...state.rows,row];try{await persist(old?'Питомец обновлён.':'Питомец добавлен.');closeEditor()}catch{}}
async function deleteCurrent(){if(!isStaff||!editingId)return;const r=state.rows.find(x=>x.id===editingId);if(!r||!confirm(`Удалить питомца «${r.name}»?`))return;const before=state.rows;state.rows=state.rows.filter(x=>x.id!==editingId);try{await persist('Питомец удалён.');closeEditor()}catch{state.rows=before;render()}}
function beginResize(e){if(!isStaff)return;const h=e.target.closest('[data-resize]');if(!h)return;e.preventDefault();e.stopPropagation();const id=h.dataset.resize;resizing={id,startX:e.clientX,startWidth:widthOf(id),handle:h};h.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none'}
function moveResize(e){if(!resizing)return;state.widths[resizing.id]=Math.max(MIN_WIDTH,Math.min(MAX_WIDTH,Math.round(resizing.startWidth+(e.clientX-resizing.startX))));const col=$('petsCols')?.querySelector(`[data-col-id="${CSS.escape(resizing.id)}"]`);if(col)col.style.width=state.widths[resizing.id]+'px';const total=defs().reduce((s,c)=>s+widthOf(c.id),0);$('petsTable').style.width=Math.max(total,$('petsTableWrap')?.clientWidth||0,900)+'px'}
async function endResize(){if(!resizing)return;resizing.handle?.classList.remove('dragging');resizing=null;document.body.style.cursor='';document.body.style.userSelect='';try{await persist('Ширина колонок сохранена.')}catch{}}
async function load(remoteOnly=false){try{await KFSupabase.ready;if(!remoteOnly){currentUser=await KFSupabase.getCurrentProfile();isStaff=!!currentUser&&['admin','moderator'].includes(currentUser.role);$('roleNote').innerHTML=roleText();$('staffActions').style.display=isStaff?'flex':'none'}state=normalize(await KFSupabase.getStore(KEY,{version:1,rows:[],widths:DEFAULT_WIDTHS}));render()}catch(e){$('roleNote').textContent='Ошибка загрузки: '+(e?.message||String(e));setStatus(e?.message||String(e),true)}}
$('searchInput').oninput=render;$('addRowBtn').onclick=()=>openEditor();$('closeEditorBtn').onclick=closeEditor;$('cancelBtn').onclick=closeEditor;$('saveBtn').onclick=saveEditor;$('deleteBtn').onclick=deleteCurrent;$('removeImageBtn').onclick=()=>{pendingImage='';$('imageInput').value='';preview('')};$('imageInput').onchange=async()=>{try{const f=$('imageInput').files?.[0];if(!f)return;setStatus('Подготовка изображения...');pendingImage=await fileToImage(f);preview(pendingImage);setStatus('Изображение готово к сохранению.')}catch(e){setStatus(e?.message||String(e),true)}};$('petsBody').onclick=e=>{if(!isStaff)return;const tr=e.target.closest('[data-id]');if(tr)openEditor(tr.dataset.id)};$('editorBackdrop').onclick=e=>{if(e.target===$('editorBackdrop'))closeEditor()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor()});$('petsHead').addEventListener('pointerdown',beginResize);window.addEventListener('pointermove',moveResize);window.addEventListener('pointerup',endResize);window.addEventListener('resize',()=>renderTableStructure());window.addEventListener('kf-supabase-synced',e=>{if(e.detail?.key===KEY&&!saving)setTimeout(()=>load(true),100)});load();
})();
</script>
</body>
