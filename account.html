<main>
<h1>Аккаунт</h1>
<p>Профиль пользователя. Аватар и ник отображаются рядом с сообщениями на форуме.</p>
<div id="profileBox" class="profile-card"></div>
<a class="back" href="index.html">← На главную</a>
</main>
<script src="image-tools-0.0.48.js?v=0.0.48"></script>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function avatarUrl(v){
  try{
    const u=new URL(String(v||''),location.href);
    return u.protocol==='https:'?u.href:'';
  }catch{return ''}
}
function initials(name){
  const parts=String(name||'Игрок').trim().split(/\s+/).filter(Boolean);
  return (parts.slice(0,2).map(x=>x[0]).join('')||'И').toUpperCase();
}

(async()=>{
  await KFSupabase.ready;
  const box=document.getElementById('profileBox');
  let profile=null;

  try{
    if(KFSupabase.configured)profile=await KFSupabase.getCurrentProfile();
  }catch(e){
    box.innerHTML='<p style="color:#ffd0d0">Не удалось загрузить профиль: '+esc(e.message||'ошибка')+'</p>';
    return;
  }

  if(!profile){
    box.innerHTML='<p style="color:#c6d5dc">Вы пока не вошли в аккаунт.</p>'
      +'<p><a href="login.html" style="color:#ffe2a0">Войти →</a></p>'
      +'<p><a href="register.html" style="color:#ffe2a0">Создать аккаунт →</a></p>';
    return;
  }

  function renderProfile(){
    const src=avatarUrl(profile.avatarUrl);
    box.innerHTML=`
      <div class="profile-layout">
        <div class="avatar-column">
          <input class="avatar-input" id="avatarFile" type="file" accept="image/*">
          <label class="avatar-picker" for="avatarFile" title="Загрузить аватар">
            ${src?`<img src="${esc(src)}" alt="Аватар ${esc(profile.nickname)}">`:`<span class="avatar-fallback">${esc(initials(profile.nickname))}</span>`}
            <span class="avatar-plus">+</span>
          </label>
          <div class="avatar-hint">Нажмите на круг, чтобы выбрать свою аватарку.<br>Она будет отображаться рядом с вашим ником на форуме.</div>
          <div class="avatar-status" id="avatarStatus"></div>
        </div>
        <div class="profile-info">
          <h2 class="profile-name">${esc(profile.nickname||'Игрок')}</h2>
          <div class="profile-bio">${esc(profile.bio||'Описание профиля пока не заполнено.')}</div>
          <div class="profile-email">E-mail: ${esc(profile.email||'')}</div>
          <div class="profile-actions">
            <a class="profile-btn" href="forum.html">Перейти на форум →</a>
            ${src?'<button class="profile-btn danger" id="removeAvatar" type="button">Удалить аватар</button>':''}
            <button class="profile-btn" id="logoutBtn" type="button">Выйти из аккаунта</button>
            ${profile.role==='admin'?'<a class="profile-btn" href="admin-backups.html">Резервные копии →</a>':''}
          </div>
        </div>
      </div>`;

    const input=document.getElementById('avatarFile');
    const status=document.getElementById('avatarStatus');

    input.onchange=async()=>{
      const file=input.files&&input.files[0];
      if(!file)return;
      status.style.color='#cbe4ed';
      status.textContent='Подготовка изображения...';
      input.disabled=true;
      try{
        const dataUrl=await imageToData(file,900);
        status.textContent='Загрузка в Supabase Storage...';
        const url=await KFSupabase.uploadImageDataUrlStrict(dataUrl);
        profile=await KFSupabase.updateMyAvatar(url);
        renderProfile();
        const s=document.getElementById('avatarStatus');
        if(s){s.style.color='#c8f4d8';s.textContent='Аватар сохранён.'}
      }catch(e){
        status.style.color='#ffd0d0';
        status.textContent=e.message||'Не удалось сохранить аватар.';
        input.disabled=false;
        input.value='';
      }
    };

    const remove=document.getElementById('removeAvatar');
    if(remove)remove.onclick=async()=>{
      if(!confirm('Удалить аватар из профиля?'))return;
      const status=document.getElementById('avatarStatus');
      status.textContent='Удаление...';
      try{
        profile=await KFSupabase.updateMyAvatar('');
        renderProfile();
      }catch(e){
        status.style.color='#ffd0d0';
        status.textContent=e.message||'Не удалось удалить аватар.';
      }
    };

    document.getElementById('logoutBtn').onclick=async()=>{
      await KFSupabase.logout();
      location.href='index.html';
    };
  }

  renderProfile();
})();
</script>
